<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Promo — Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888; --paper-card: #ffffff; --accent: #c8602a; }
        body { background: linear-gradient(135deg, #f0f2f5 0%, #e2e8f0 100%); font-family: 'DM Sans', sans-serif; color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 3rem 1rem; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

        .dashboard-wrapper { width: 100%; max-width: 1350px; display: flex; gap: 2rem; margin: auto; }

        /* 🟦 SIDEBAR */
        .dashboard-sidebar { width: 280px; background: linear-gradient(135deg, var(--ink) 0%, #000000 100%); border-radius: 12px; padding: 2.5rem 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.15); color: white; animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: sticky; top: 2rem; height: calc(100vh - 4rem); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 2.5rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.5rem; color: #fff; }
        .sidebar-brand span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 0.7rem; display: block; letter-spacing: 3px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 500; transition: all 0.3s ease; margin-bottom: 0.5rem; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; box-shadow: inset 3px 0 0 var(--accent); }

        /* ⬜ Main Content Area */
        .dashboard-content { flex: 1; display: flex; flex-direction: column; gap: 2rem; align-items: flex-start; }
        .premium-card { background: var(--paper-card); border-radius: 12px; padding: 3rem; box-shadow: 0 25px 50px rgba(0,0,0,0.04); animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; width: 100%; max-width: 700px; border-top: 4px solid var(--ink); }

        .custom-input { padding: 14px 18px; border: 2px solid #eee; border-radius: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; background: #fafafa; }
        .custom-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(200,96,42,0.1); outline: none; }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">NEXUS<span>ADMINISTRATOR</span></div>
        <nav style="flex: 1; overflow-y: auto; padding-right: 5px;">
            <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-collection"></i> Inventory Hub</a>
            <a th:href="@{/admin/requests}" class="nav-item"><i class="bi bi-journal-plus"></i> Book Requests</a>
            <a th:href="@{/admin/users}" class="nav-item"><i class="bi bi-people"></i> User Management</a>
            <a th:href="@{/admin/orders/manage}" class="nav-item"><i class="bi bi-box-seam"></i> Orders</a>
            <a th:href="@{/admin/authors/list}" class="nav-item"><i class="bi bi-pen"></i> Authors</a>
            <a th:href="@{/admin/announcements/list}" class="nav-item"><i class="bi bi-megaphone"></i> Announcements</a>
            <a th:href="@{/admin/promos/list}" class="nav-item active"><i class="bi bi-ticket-perforated"></i> Promo Codes</a>
        </nav>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; margin-top: 1rem;">
            <a th:href="@{/admin/dashboard}" class="nav-item text-white-50"><i class="bi bi-arrow-left"></i> Back to Dash</a>
        </div>
    </aside>

    <main class="dashboard-content">
        <div class="premium-card">
            <h2 class="font-playfair fw-bold mb-4 pb-3 border-bottom"><i class="bi bi-magic text-warning me-2"></i>Generate Promotion</h2>

            <form th:action="@{/admin/promos/save}" th:object="${promoCode}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Secret Code String</label>
                    <input type="text" th:field="*{code}" class="form-control custom-input" placeholder="e.g. SLIIT2026" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Discount Percentage (%)</label>
                    <input type="number" th:field="*{discountPercentage}" class="form-control custom-input" min="1" max="99" placeholder="e.g. 15" required>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Start Date</label>
                        <input type="datetime-local" th:field="*{startDate}" class="form-control custom-input" required>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">End Date</label>
                        <input type="datetime-local" th:field="*{endDate}" class="form-control custom-input" required>
                    </div>
                </div>

                <div class="form-check form-switch mb-5 p-3 rounded" style="background: #faf8f4; border: 1px solid #eee;">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input ms-0 mt-0" type="checkbox" th:field="*{active}" id="activeSwitch" checked style="width: 2.5rem; height: 1.25rem; cursor: pointer;">
                        <label class="form-check-label fw-bold text-dark ms-3" for="activeSwitch" style="cursor: pointer;">Activate Immediately</label>
                    </div>
                </div>

                <div class="d-flex gap-3">
                    <a th:href="@{/admin/promos/list}" class="btn btn-light border-secondary fw-bold w-100 py-3 text-uppercase" style="letter-spacing: 1px; font-size: 0.9rem; border-radius: 8px;">Cancel</a>
                    <button type="submit" class="btn btn-dark fw-bold w-100 py-3 text-uppercase" style="background: var(--accent); border: none; letter-spacing: 1px; font-size: 0.9rem; border-radius: 8px; box-shadow: 0 6px 15px rgba(200,96,42,0.3);">Deploy Code</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
