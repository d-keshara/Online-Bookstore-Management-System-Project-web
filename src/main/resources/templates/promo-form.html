<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Promo — Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'DM Sans', sans-serif; padding: 4rem 1rem; }
        .form-card { max-width: 600px; margin: 0 auto; background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.05); border-top: 4px solid #1a1a1a; }
        .custom-input { padding: 12px 16px; border: 2px solid #eee; border-radius: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .custom-input:focus { border-color: #c8602a; box-shadow: none; outline: none; }
    </style>
</head>
<body>

<div class="form-card">
    <h2 class="font-playfair fw-bold mb-4">Generate Promotion</h2>

    <form th:action="@{/admin/promos/save}" th:object="${promoCode}" method="post">

        <div class="mb-4">
            <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Secret Code String</label>
            <input type="text" th:field="*{code}" class="form-control custom-input" placeholder="e.g. SLIIT2026" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Discount Percentage (%)</label>
            <input type="number" th:field="*{discountPercentage}" class="form-control custom-input" min="1" max="99" placeholder="e.g. 15" required>
        </div>

        <div class="form-check form-switch mb-5">
            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch" checked>
            <label class="form-check-label fw-bold text-dark ms-2" for="activeSwitch">Activate Immediately</label>
        </div>

        <div class="d-flex gap-3">
            <a th:href="@{/admin/promos/list}" class="btn btn-light fw-bold w-100 py-3 rounded-pill text-uppercase" style="letter-spacing: 1px; font-size: 0.9rem;">Cancel</a>
            <button type="submit" class="btn btn-dark fw-bold w-100 py-3 rounded-pill text-uppercase" style="background: #c8602a; border-color: #c8602a; letter-spacing: 1px; font-size: 0.9rem;">Deploy Code</button>
        </div>
    </form>
</div>

</body>
</html>
