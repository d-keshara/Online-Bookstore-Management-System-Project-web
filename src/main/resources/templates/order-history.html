<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Order History - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<nav class="navbar navbar-dark bg-dark mb-4 rounded shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/catalog">NEXUS BOOKSTORE</a>
        <div class="text-white">
            Welcome back,
            <span class="fw-bold text-info" th:text="${username}">User</span>
        </div>
    </div>
</nav>

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2>My Purchase History</h2>
        <a href="/catalog" class="btn btn-outline-primary">Continue Shopping</a>
    </div>

    <div th:if="${orders == null or orders.empty}" class="text-center py-5">
        <h4 class="text-muted">You haven't purchased any books yet.</h4>
        <a href="/catalog" class="btn btn-primary mt-3">Browse Catalog</a>
    </div>

    <table th:if="${orders != null and !orders.empty}" class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Order Number</th>
            <th>Date</th>
            <th>Total Paid</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>
                <strong class="text-primary">
                    #NX-<span th:text="${order.orderId}">ID</span>
                </strong>
            </td>
            <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy HH:mm')}">Date</td>
            <td class="fw-bold text-success">
                LKR <span th:text="${order.totalPrice}">0.00</span>
            </td>
            <td>
                <span class="badge bg-success" th:if="${order.status == 'PAID'}">Paid &amp; Delivered</span>
                <span class="badge bg-warning text-dark" th:if="${order.status != 'PAID'}" th:text="${order.status}">Status</span>
            </td>
            <td>
                <a th:href="@{'/api/orders/receipt/' + ${order.orderId}}" class="btn btn-sm btn-outline-primary shadow-sm">
                    Download Receipt
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
