<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order History - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between mb-4">
        <h2>Order Transaction History</h2>
        <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Total (LKR)</th>
            <th>Date</th>
            <th>Receipt</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}">ID</td>

            <td th:text="${order.user != null ? order.user.username : 'Guest'}">User</td>

            <td th:text="${order.totalPrice}">0.00</td>

            <td th:text="${order.orderDate != null ? order.orderDate : 'N/A'}">Date</td>

            <td>
                <span class="badge bg-success">Paid</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
