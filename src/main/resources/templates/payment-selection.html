<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Payment Selection - Nexus Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #faf8f4; font-family: 'DM Sans', sans-serif; }
    .payment-card { border: 2px solid transparent; transition: 0.3s; cursor: pointer; }
    .btn-check:checked + .payment-card { border-color: #c8602a; background-color: #fff9f5; }
    .nexus-header { background: #1a1a1a; color: white; padding: 1rem; }
  </style>
</head>
<body>

<div class="nexus-header text-center mb-5">
  <h2 class="fw-bold" style="letter-spacing: 2px;">NEXUS PAYMENT</h2>
</div>

<div class="container" style="max-width: 800px;">
  <div class="bg-white p-5 shadow-sm rounded">
    <h3 class="mb-4 fw-bold border-bottom pb-3">Finalize Your Purchase</h3>

    <div class="d-flex justify-content-between mb-4 fs-5 fw-bold text-muted">
      <span>Amount to Pay:</span>
      <span class="text-dark" th:text="'LKR ' + ${cartTotal}">LKR 0.00</span>
    </div>

    <form th:action="@{/orders/confirm}" method="post">
      <div class="row g-3 mb-5">
        <!-- Option 1: COD -->
        <div class="col-md-6">
          <input type="radio" class="btn-check" name="paymentMethod" id="cod" value="COD" checked>
          <label class="card h-100 p-4 payment-card" for="cod">
            <i class="bi bi-cash-stack fs-1 text-success mb-3"></i>
            <h5 class="fw-bold">Cash on Delivery</h5>
            <p class="small text-muted mb-0">Pay when your books arrive at your door.</p>
          </label>
        </div>

        <!-- Option 2: Card -->
        <div class="col-md-6">
          <input type="radio" class="btn-check" name="paymentMethod" id="card" value="CARD">
          <label class="card h-100 p-4 payment-card" for="card">
            <i class="bi bi-credit-card-2-front fs-1 text-primary mb-3"></i>
            <h5 class="fw-bold">Card Payment</h5>
            <p class="small text-muted mb-0">Securely pay now using Visa or Mastercard.</p>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-pill shadow">
        COMPLETE ORDER <i class="bi bi-shield-lock-fill ms-2"></i>
      </button>
    </form>
  </div>
</div>

</body>
</html>
