<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout — Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --ink: #1a1a1a; --ink-muted: #888; --paper: #faf8f4; --paper-warm: #f3efe8; --paper-card: #ffffff; --accent: #c8602a; --accent-dark: #9e4a1e; --border: rgba(0,0,0,0.09); }
        body { background: var(--paper); font-family: 'DM Sans', sans-serif; color: var(--ink); display: flex; flex-direction: column; min-height: 100vh; }

        .site-nav { background: var(--ink); position: sticky; top: 0; z-index: 1000; }
        .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .nav-brand { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #fff; }
        .brand-nexus { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
        .btn-nav-ghost { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12.5px; font-weight: 500; padding: 0.42rem 0.9rem; border: 1px solid transparent; color: rgba(255,255,255,0.8); text-decoration: none; transition: 0.15s; }
        .btn-nav-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); }

        .page-layout { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 4rem 1rem; }
        .checkout-card { background: var(--paper-card); border: 1px solid var(--border); border-radius: 8px; padding: 3rem; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .checkout-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 2rem; }
        .total-box { background: var(--paper-warm); border-radius: 6px; padding: 1.5rem; text-align: center; margin-bottom: 2rem; border: 1px dashed var(--border); }

        .payment-option { display: flex; align-items: center; gap: 1.2rem; padding: 1.25rem; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s ease; background: #fff; }
        .payment-option input[type="radio"] { display: none; }
        .radio-circle { width: 22px; height: 22px; border: 2px solid var(--ink-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .radio-circle::after { content: ''; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; transform: scale(0); transition: 0.2s; }

        .payment-option:has(input:checked) { border-color: var(--accent); background: rgba(200,96,42,0.03); }
        .payment-option:has(input:checked) .radio-circle { border-color: var(--accent); }
        .payment-option:has(input:checked) .radio-circle::after { transform: scale(1); }
        .payment-option:has(input:checked) i { color: var(--accent) !important; }

        .btn-confirm { background: var(--accent); color: #fff; width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 6px; margin-top: 1.5rem; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-confirm:hover { background: var(--accent-dark); color: #fff; }

        /* Dynamic Forms */
        .dynamic-form { display: none; padding: 1.5rem; background: #fafafa; border: 1px solid #eee; border-radius: 8px; margin-bottom: 1.5rem; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-input { border: 1px solid #ccc; border-radius: 6px; padding: 12px; font-weight: 500; background: #fff; }
        .custom-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,96,42,0.1); outline: none; }
    </style>
</head>
<body>

<nav class="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" th:href="@{/catalog}">
            <span class="brand-nexus">NEXUS</span>
            <span class="brand-bookstore">BOOKSTORE</span>
        </a>
        <a th:href="@{/cart}" class="btn-nav-ghost"><i class="bi bi-arrow-left"></i> Return to Cart</a>
    </div>
</nav>

<div class="page-layout">
    <div class="checkout-card">
        <h2 class="checkout-title">Complete Payment</h2>

        <div class="total-box">
            <span class="text-muted small fw-bold text-uppercase tracking-wide">Final Amount Due</span>
            <h2 class="font-playfair fw-bold m-0 mt-1" style="color: var(--accent);" th:text="'LKR ' + ${cartTotal}">LKR 0.00</h2>
        </div>

        <form id="checkoutForm" th:action="@{/orders/confirm}" method="post">

            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="COD" onchange="toggleForms()" required>
                <div class="radio-circle"></div>
                <div class="flex-grow-1">
                    <strong class="d-block fs-5" style="color: var(--ink);">Cash on Delivery</strong>
                    <span class="text-muted small">Pay with cash when your books arrive.</span>
                </div>
                <i class="bi bi-box-seam fs-3 text-secondary transition-all"></i>
            </label>

            <div id="cod-details" class="dynamic-form">
                <h6 class="fw-bold mb-3"><i class="bi bi-geo-alt-fill text-warning me-2"></i>Delivery Details</h6>
                <div class="mb-3">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Full Delivery Address</label>
                    <textarea name="deliveryAddress" class="form-control custom-input shadow-none" rows="2" placeholder="e.g. 123 SLIIT Road, Malabe" id="codAddress"></textarea>
                </div>
                <div class="mb-0">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Contact Number</label>
                    <input type="text" name="contactNumber" class="form-control custom-input shadow-none" placeholder="e.g. 076 123 4567" id="codPhone">
                </div>
            </div>

            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="CARD" onchange="toggleForms()" required>
                <div class="radio-circle"></div>
                <div class="flex-grow-1">
                    <strong class="d-block fs-5" style="color: var(--ink);">Credit / Debit Card</strong>
                    <span class="text-muted small">Pay securely online via encrypted gateway.</span>
                </div>
                <i class="bi bi-credit-card ms-auto fs-3 text-secondary transition-all"></i>
            </label>

            <div id="card-details" class="dynamic-form">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <h6 class="fw-bold mb-0"><i class="bi bi-lock-fill text-success me-2"></i>Secure Card Payment</h6>
                    <div class="d-flex gap-1 fs-4">
                        <i class="bi bi-cc-visa text-primary"></i>
                        <i class="bi bi-cc-mastercard text-danger"></i>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Cardholder Name</label>
                    <input type="text" class="form-control custom-input shadow-none" placeholder="JOHN DOE" id="cardName">
                </div>
                <div class="mb-3">
                    <label class="small fw-bold text-muted text-uppercase mb-1">Card Number</label>
                    <input type="text" class="form-control custom-input shadow-none" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" id="cardNumber">
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="small fw-bold text-muted text-uppercase mb-1">Expiry Date</label>
                        <input type="text" class="form-control custom-input shadow-none" placeholder="MM/YY" maxlength="5" id="cardExpiry">
                    </div>
                    <div class="col-6">
                        <label class="small fw-bold text-muted text-uppercase mb-1">CVV</label>
                        <input type="password" class="form-control custom-input shadow-none" placeholder="•••" maxlength="3" id="cardCvv">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-confirm">
                <span id="btnText">Place Order & Pay</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </form>
    </div>
</div>

<script>
    // 🔥 Toggle the forms based on radio selection
    function toggleForms() {
        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
        const codDetails = document.getElementById('cod-details');
        const cardDetails = document.getElementById('card-details');

        // Form Validation Requirements
        const codAddress = document.getElementById('codAddress');
        const codPhone = document.getElementById('codPhone');
        const cardInputs = [document.getElementById('cardName'), document.getElementById('cardNumber'), document.getElementById('cardExpiry'), document.getElementById('cardCvv')];

        if (paymentMethod === 'COD') {
            codDetails.style.display = 'block';
            cardDetails.style.display = 'none';
            codAddress.required = true; codPhone.required = true;
            cardInputs.forEach(input => input.required = false);
        } else {
            codDetails.style.display = 'none';
            cardDetails.style.display = 'block';
            codAddress.required = false; codPhone.required = false;
            cardInputs.forEach(input => input.required = true);
        }
    }

    // 🔥 The Fake Payment Gateway Logic
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

        // Only simulate the gateway delay if it's a Card payment
        if (paymentMethod === 'CARD') {
            e.preventDefault(); // Stop immediate submission

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            btnText.innerText = 'Contacting Bank...';
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.8';

            // Simulate a 2.5 second bank processing delay, then actually submit!
            setTimeout(() => {
                btnText.innerText = 'Payment Successful!';
                btnSpinner.classList.replace('spinner-border', 'bi');
                btnSpinner.classList.add('bi-check-circle-fill', 'text-white', 'fs-5');

                setTimeout(() => {
                    this.submit(); // Officially submit to Spring Boot
                }, 800);
            }, 2500);
        }
    });
</script>

</body>
</html>
