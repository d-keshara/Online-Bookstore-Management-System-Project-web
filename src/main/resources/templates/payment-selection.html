<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout — Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a;
            --ink-soft: #3d3d3d;
            --ink-muted: #888;
            --paper: #faf8f4;
            --paper-warm: #f3efe8;
            --paper-card: #ffffff;
            --accent: #c8602a;
            --accent-light: #f5ece4;
            --accent-dark: #9e4a1e;
            --border: rgba(0,0,0,0.09);
        }

        body {
            background: var(--paper);
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVBAR - Matches Cart/Details */
        .site-nav { background: var(--ink); position: sticky; top: 0; z-index: 1000; }
        .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .nav-brand { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #fff; }
        .brand-nexus { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
        .brand-bookstore { font-family: 'DM Sans', sans-serif; font-size: 0.8rem; letter-spacing: 1.5px; color: var(--accent); border-left: 1px solid rgba(255,255,255,0.2); padding-left: 0.6rem; margin-top: 3px; }

        .btn-nav-ghost { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12.5px; font-weight: 500; padding: 0.42rem 0.9rem; border: 1px solid transparent; color: rgba(255,255,255,0.8); text-decoration: none; transition: 0.15s; }
        .btn-nav-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); }

        /* PAYMENT LAYOUT */
        .page-layout { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem; }

        .checkout-card {
            background: var(--paper-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .checkout-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 2rem; }

        .total-box {
            background: var(--paper-warm);
            border-radius: 6px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            border: 1px dashed var(--border);
        }

        /* CUSTOM PAYMENT RADIO CARDS */
        .payment-option {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .payment-option:hover { border-color: var(--ink-muted); background: var(--paper); }

        /* Hide the default radio button */
        .payment-option input[type="radio"] { display: none; }

        /* Custom Radio Circle */
        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid var(--ink-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .radio-circle::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            transform: scale(0);
            transition: 0.2s;
        }

        /* Active State when selected */
        .payment-option:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .payment-option:has(input:checked) .radio-circle { border-color: var(--accent); }
        .payment-option:has(input:checked) .radio-circle::after { transform: scale(1); }
        .payment-option:has(input:checked) i { color: var(--accent) !important; }

        .btn-confirm {
            background: var(--accent);
            color: #fff;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            margin-top: 1.5rem;
            transition: 0.2s;
        }

        .btn-confirm:hover { background: var(--accent-dark); color: #fff; }
    </style>
</head>
<body>

<nav class="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" th:href="@{/catalog}">
            <span class="brand-nexus">NEXUS</span>
            <span class="brand-bookstore">BOOKSTORE</span>
        </a>
        <a th:href="@{/cart}" class="btn-nav-ghost"><i class="bi bi-arrow-left"></i> Return to Cart</a>
    </div>
</nav>

<div class="page-layout">
    <div class="checkout-card">
        <h2 class="checkout-title">Payment Method</h2>

        <div class="total-box">
            <span class="text-muted small fw-bold text-uppercase tracking-wide">Amount Due</span>
            <h2 class="font-playfair fw-bold m-0 mt-1" style="color: var(--accent);" th:text="'LKR ' + ${cartTotal}">LKR 0.00</h2>
        </div>

        <form th:action="@{/orders/confirm}" method="post">

            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="COD" required>
                <div class="radio-circle"></div>
                <div class="flex-grow-1">
                    <strong class="d-block fs-5" style="color: var(--ink);">Cash on Delivery</strong>
                    <span class="text-muted small">Pay with cash when your books arrive.</span>
                </div>
                <i class="bi bi-box-seam fs-3 text-secondary transition-all"></i>
            </label>

            <label class="payment-option">
                <input type="radio" name="paymentMethod" value="CARD" required>
                <div class="radio-circle"></div>
                <div class="flex-grow-1">
                    <strong class="d-block fs-5" style="color: var(--ink);">Credit / Debit Card</strong>
                    <span class="text-muted small">Pay securely online via card processing.</span>
                </div>
                <i class="bi bi-credit-card ms-auto fs-3 text-secondary transition-all"></i>
            </label>

            <button type="submit" class="btn-confirm">Place Order</button>
        </form>
    </div>
</div>

<footer class="bg-dark text-white-50 text-center py-4 mt-auto">
    <small>© 2026 Nexus Bookstore · Secure Checkout</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
