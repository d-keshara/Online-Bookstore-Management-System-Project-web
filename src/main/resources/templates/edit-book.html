<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light p-5">
<div class="container bg-white p-4 shadow-sm rounded" style="max-width: 600px;">
    <h2 class="mb-4">Edit Book Details</h2>

    <form th:action="@{/admin/save}" th:object="${book}" method="post" enctype="multipart/form-data">

        <input type="hidden" th:field="*{bookId}">

        <div class="mb-3">
            <label class="form-label">Book Title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Author</label>
            <select th:field="*{author}" class="form-select" required>
                <option value="" disabled selected>-- Choose an Author --</option>
                <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}">Author Name</option>
            </select>
            <div class="form-text">
                Don't see the author? <a href="/admin/authors/add">Add them first</a>.
            </div>
        </div>

        <!-- UPDATED: Replaced text input with the 10-category dropdown -->
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{category}" class="form-select" required>
                <option value="" disabled>Select a category...</option>
                <option value="Fiction">Fiction</option>
                <option value="Non-Fiction">Non-Fiction</option>
                <option value="Sci-Fi & Fantasy">Sci-Fi & Fantasy</option>
                <option value="Mystery & Thriller">Mystery & Thriller</option>
                <option value="Biography">Biography</option>
                <option value="Educational">Educational</option>
                <option value="Romance">Romance</option>
                <option value="Computers & Technology">Computers & Technology</option>
                <option value="History">History</option>
                <option value="Children & YA">Children & YA</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Price (LKR)</label>
                <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" min="0" th:field="*{stock}" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Book Cover Photo</label>

            <div th:if="${book.coverImagePath != null}" class="mb-3 d-flex align-items-center gap-3 p-2 border rounded bg-light">
                <img th:src="@{${book.coverImagePath}}" alt="Current Cover" class="rounded shadow-sm" style="height: 80px; width: auto; object-fit: cover;">
                <div class="small text-muted">
                    <strong>Current image</strong><br>
                    Leave the upload box below blank to keep this image.
                </div>
            </div>

            <div class="p-4 text-center rounded bg-light" style="border: 2px dashed #ccc;">
                <i class="bi bi-cloud-arrow-up fs-2 text-secondary mb-2"></i>
                <input type="file" name="imageFile" id="imageFile" class="form-control mt-2" accept="image/png, image/jpeg, image/jpg">
                <div class="form-text mt-2">Recommended: PNG or JPG. Max size: 5MB.</div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">Update Book</button>
            <a href="/admin/dashboard" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
