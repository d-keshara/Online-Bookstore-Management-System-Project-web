<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nexus Bookstore - Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .navbar-brand { font-size: 1.5rem; letter-spacing: 1px; }
        .hover-shadow { transition: all 0.3s ease; }
        .hover-shadow:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" th:href="@{/catalog}">NEXUS BOOKSTORE</a>

        <div class="d-flex align-items-center gap-3">
            <form class="d-flex" th:action="@{/catalog}" method="get">
                <input class="form-control form-control-sm me-2" type="search" name="keyword" th:value="${keyword}" placeholder="Search books..." aria-label="Search">
                <button class="btn btn-outline-light btn-sm" type="submit">Search</button>
            </form>

            <!-- GUEST VIEW -->
            <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm ms-2">Sign In</a>
                <a th:href="@{/register}" class="btn btn-primary btn-sm">Sign Up</a>
            </div>

            <!-- LOGGED IN VIEW -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">

                <!-- ADMIN FEATURES -->
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}" class="btn btn-warning btn-sm fw-bold text-dark">
                        <i class="bi bi-speedometer2"></i> Admin Panel
                    </a>
                </div>

                <!-- AUTHOR FEATURES -->
                <div sec:authorize="hasRole('AUTHOR')">
                    <a th:href="@{/author/dashboard}" class="btn btn-info btn-sm fw-bold text-white">
                        <i class="bi bi-pen"></i> Author Portal
                    </a>
                </div>

                <a th:href="@{/my-account}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-person-circle"></i> Profile
                </a>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="text-center mb-5 mt-4">
        <h2 class="fw-bold text-dark">Best Sellers</h2>
        <hr class="mx-auto border-info border-3 opacity-100" style="width: 120px;">
    </div>

    <!-- Book Grid -->
    <div class="row row-cols-1 row-cols-md-4 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card h-100 border-0 shadow-sm text-center p-3 hover-shadow">
                <div class="bg-secondary bg-opacity-10 rounded mx-auto mt-2 d-flex align-items-center justify-content-center" style="width: 150px; height: 220px;">
                    <i class="bi bi-book fs-1 text-secondary opacity-50"></i>
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold text-uppercase mb-1" th:text="${book.title}">Book Title</h5>
                    <p class="text-muted small mb-2" th:text="${book.author != null ? book.author.name : 'Unknown Author'}">Author</p>
                    <h5 class="text-info fw-bold" th:text="'LKR ' + ${book.price}">LKR 0.00</h5>

                    <div sec:authorize="isAuthenticated()">
                        <form th:action="@{/buy}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.bookId}">
                            <button type="submit" class="btn btn-sm btn-dark w-100 mt-2 py-2">Buy Now</button>
                        </form>
                    </div>

                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-sm btn-outline-secondary w-100 mt-2 py-2">Sign in to Buy</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 0}" aria-label="Page navigation" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/catalog(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
