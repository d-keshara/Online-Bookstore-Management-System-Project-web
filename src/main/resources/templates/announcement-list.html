<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Announcements</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
            padding:3rem;
        }

        .card-box{
            background:white;
            padding:2rem;
            border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,.04);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card-box">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Manage Announcements</h2>

            <a th:href="@{/admin/announcements}"
               class="btn btn-dark">
                + New Announcement
            </a>

        </div>

        <div th:if="${successMessage}"
             class="alert alert-success"
             th:text="${successMessage}">
        </div>

        <table class="table table-hover align-middle">

            <thead>
            <tr>
                <th>Title</th>
                <th>Date Posted</th>
                <th width="220">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="announcement : ${announcements}">

                <td th:text="${announcement.title}"></td>

                <td th:text="${announcement.datePosted}"></td>

                <td>

                    <a th:href="@{/admin/announcements/edit/{id}(id=${announcement.id})}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <form th:action="@{/admin/announcements/delete/{id}(id=${announcement.id})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
