<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Account - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .navbar-brand { font-size: 1.5rem; letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/catalog">NEXUS BOOKSTORE</a>
        <a href="/catalog" class="btn btn-outline-light btn-sm">← Back to Shop</a>
    </div>
</nav>

<div class="container mb-5">

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <strong th:text="${successMessage}">Success!</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong th:text="${errorMessage}">Error!</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <a href="/my-account" class="list-group-item list-group-item-action active fw-bold bg-dark border-dark">
                            <i class="bi bi-person-circle me-2"></i> Account Details
                        </a>
                        <a href="/my-orders" class="list-group-item list-group-item-action text-dark">
                            <i class="bi bi-box-seam me-2"></i> My Orders
                        </a>
                        <a href="/my-reviews" class="list-group-item list-group-item-action text-dark">
                            <i class="bi bi-star me-2"></i> My Reviews
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">

            <!-- PROFILE INFO CARD -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Profile Information</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/account/update}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">FULL NAME</label>
                                <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">EMAIL (USERNAME)</label>
                                <!-- Email is usually disabled so they can't break their login -->
                                <input type="email" class="form-control bg-light" th:value="${user.username}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">PHONE NUMBER</label>
                                <input type="text" class="form-control" name="phoneNumber" th:value="${user.phoneNumber}">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small fw-bold">DELIVERY ADDRESS</label>
                                <textarea class="form-control" name="address" rows="3" th:text="${user.address}"></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Save Changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- CHANGE PASSWORD CARD -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Change Password</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/account/change-password}" method="post">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">CURRENT PASSWORD</label>
                                <input type="password" class="form-control" name="currentPassword" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">NEW PASSWORD</label>
                                <input type="password" class="form-control" name="newPassword" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">CONFIRM NEW PASSWORD</label>
                                <input type="password" class="form-control" name="confirmPassword" required>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-dark px-4 fw-bold">Update Password</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
