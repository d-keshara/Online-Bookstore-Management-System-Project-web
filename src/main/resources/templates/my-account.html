<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888;
            --paper: #faf8f4; --paper-card: #ffffff;
            --accent: #c8602a; --accent-dark: #9e4a1e;
        }

        body {
            background: linear-gradient(135deg, var(--paper) 0%, #e9e4dc 100%);
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* ✨ Premium Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1100px;
            display: flex;
            gap: 2rem;
            margin: auto;
        }

        /* 🟦 Premium Dark Sidebar */
        .dashboard-sidebar {
            width: 280px;
            background: linear-gradient(135deg, var(--ink) 0%, #2a2a2a 100%);
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            color: white;
            animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
            height: fit-content;
        }

        .dashboard-sidebar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at bottom left, rgba(200,96,42,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .sidebar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1.5rem;
            z-index: 2;
            position: relative;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 1;
            position: relative;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(200,96,42,0.3);
        }

        .nav-item i { font-size: 1.2rem; }

        /* ⬜ Main Content Area */
        .dashboard-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .premium-card {
            background: var(--paper-card);
            border-radius: 12px;
            padding: 3rem 4rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.05);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .premium-card:nth-child(1) { animation-delay: 0.2s; }
        .premium-card:nth-child(2) { animation-delay: 0.4s; }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--paper);
            padding-bottom: 10px;
        }

        /* Form Controls */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 1.2rem;
        }

        .form-group {
            position: relative;
            flex: 1;
        }

        .label-text {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper { position: relative; width: 100%; }

        .custom-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            background: #fafafa;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            color: var(--ink);
        }

        .custom-input:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200,96,42,0.1);
        }

        .custom-input[readonly] {
            background: #f0f0f0;
            color: var(--ink-muted);
            cursor: not-allowed;
            border-color: transparent;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-muted);
            font-size: 1rem;
        }

        textarea.custom-input + .input-icon {
            top: 15px;
            transform: none;
        }

        .btn-save {
            background: var(--ink);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1rem;
        }

        .btn-save:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(200,96,42,0.2);
        }

        /* Back to Shop Top Bar */
        .top-bar {
            position: absolute;
            top: 2rem;
            right: 3rem;
            z-index: 100;
        }

        @media (max-width: 992px) {
            .dashboard-wrapper { flex-direction: column; }
            .dashboard-sidebar { width: 100%; padding: 1.5rem; }
            .sidebar-brand { display: none; }
            .sidebar-nav { flex-direction: row; justify-content: space-between; overflow-x: auto; }
            .nav-item { padding: 10px; font-size: 0.9rem; }
            .premium-card { padding: 2rem; }
            .top-bar { display: none; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a th:href="@{/catalog}" class="btn btn-dark btn-sm rounded-pill px-4 py-2 fw-semibold shadow-sm border-0" style="background: var(--ink);">
        <i class="bi bi-arrow-left me-1"></i> Back to Shop
    </a>
</div>

<div class="dashboard-wrapper">

    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">NEXUS</div>
        <nav class="sidebar-nav">
            <a th:href="@{/my-account}" class="nav-item active">
                <i class="bi bi-person-circle"></i> Account Details
            </a>
            <a th:href="@{/my-orders}" class="nav-item">
                <i class="bi bi-box-seam"></i> My Orders
            </a>
            <a th:href="@{/my-reviews}" class="nav-item">
                <i class="bi bi-star"></i> My Reviews
            </a>
            <a th:href="@{/logout}" class="nav-item mt-4 text-danger opacity-75">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </nav>
    </aside>

    <main class="dashboard-content">

        <div th:if="${successMessage}" class="alert alert-success py-3 small fw-medium shadow-sm border-0 mb-0 rounded-3" style="background: #e8f4eb; color: #1e4620; animation: fadeInUp 0.5s ease;">
            <i class="bi bi-check-circle-fill me-2 fs-6 align-middle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-3 small fw-medium shadow-sm border-0 mb-0 rounded-3" style="background: #fde8e8; color: #721c24; animation: fadeInUp 0.5s ease;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-6 align-middle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="premium-card">
            <h3 class="section-title h4">Profile Information</h3>

            <form th:action="@{/account/update}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" class="custom-input" name="fullName" th:value="${user.fullName}" required>
                            <i class="bi bi-person input-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="label-text">Email (Username)</label>
                        <div class="input-wrapper">
                            <input type="email" class="custom-input" th:value="${user.username}" readonly>
                            <i class="bi bi-lock-fill input-icon text-danger opacity-50"></i>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="text" class="custom-input" name="phoneNumber" th:value="${user.phoneNumber}">
                            <i class="bi bi-telephone input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">Delivery Address</label>
                        <div class="input-wrapper">
                            <textarea class="custom-input" name="address" rows="3" th:text="${user.address}" style="padding-left: 42px;"></textarea>
                            <i class="bi bi-geo-alt input-icon"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-save shadow-sm">
                    <i class="bi bi-check2-circle"></i> Save Changes
                </button>
            </form>
        </div>

        <div class="premium-card">
            <h3 class="section-title h4">Account Security</h3>

            <form th:action="@{/account/change-password}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">Current Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="currentPassword" class="custom-input" required>
                            <i class="bi bi-key input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="newPassword" class="custom-input" required>
                            <i class="bi bi-shield-lock input-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="label-text">Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="confirmPassword" class="custom-input" required>
                            <i class="bi bi-shield-check input-icon"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-save shadow-sm">
                    <i class="bi bi-shield-lock"></i> Update Password
                </button>
            </form>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
