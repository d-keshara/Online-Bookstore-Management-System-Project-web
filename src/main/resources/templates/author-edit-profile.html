<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — Nexus Author Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888;
            --paper: #faf8f4; --paper-card: #ffffff;
            --accent: #c8602a; --accent-dark: #9e4a1e;
        }

        body {
            background: linear-gradient(135deg, var(--paper) 0%, #e9e4dc 100%);
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* ✨ Premium Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .profile-wrapper {
            width: 100%;
            max-width: 650px;
            background: var(--paper-card);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            overflow: hidden;
            animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        /* Premium Header Banner */
        .profile-banner {
            height: 140px;
            background: linear-gradient(135deg, var(--ink) 0%, #2a2a2a 100%);
            position: relative;
        }

        .profile-banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(200,96,42,0.2) 0%, transparent 60%);
        }

        /* Avatar Section */
        .avatar-container {
            text-align: center;
            margin-top: -60px;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease forwards;
            animation-delay: 0.1s;
            opacity: 0;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            background: var(--paper);
            border: 4px solid var(--paper-card);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .profile-body {
            padding: 2rem 4rem 4rem 4rem;
        }

        .header-text {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .form-group:nth-of-type(1) { animation-delay: 0.3s; }
        .form-group:nth-of-type(2) { animation-delay: 0.4s; }
        .form-group:nth-of-type(3) { animation-delay: 0.5s; }

        .label-text {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .custom-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            background: #fafafa;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            color: var(--ink);
        }

        .custom-input:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200,96,42,0.1);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-muted);
            font-size: 1rem;
        }

        /* Fix for textarea icon so it stays at the top, not the middle */
        textarea.custom-input + .input-icon {
            top: 15px;
            transform: none;
        }

        /* Buttons */
        .action-bar {
            display: flex;
            gap: 15px;
            margin-top: 2.5rem;
            animation: fadeInUp 0.5s ease forwards;
            animation-delay: 0.6s;
            opacity: 0;
        }

        .btn-custom {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-cancel {
            background: #fafafa;
            color: var(--ink-soft);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .btn-cancel:hover {
            background: #f0f0f0;
            color: var(--ink);
        }

        .btn-save {
            background: var(--ink);
            color: white;
            border: none;
        }

        .btn-save:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(200,96,42,0.2);
        }

        @media (max-width: 768px) {
            .profile-body { padding: 2rem; }
            .action-bar { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

<div class="profile-wrapper">
    <div class="profile-banner"></div>

    <div class="avatar-container">
        <div class="avatar-circle">
            <i class="bi bi-person-bounding-box"></i>
        </div>
    </div>

    <div class="profile-body">
        <div class="header-text">
            <h2 class="font-playfair fw-bold text-dark mb-1">Author Settings</h2>
            <p class="text-muted small mb-0">Update your public persona on the Nexus Store.</p>
        </div>

        <form th:action="@{/author/update-profile}" th:object="${author}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label class="label-text">Display Name</label>
                <div class="input-wrapper">
                    <input type="text" th:field="*{name}" class="custom-input" required placeholder="How readers will see your name">
                    <i class="bi bi-pen input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="label-text">Biography</label>
                <div class="input-wrapper">
                    <textarea th:field="*{biography}" class="custom-input" rows="5" placeholder="Share your story with your readers..." style="padding-left: 42px;"></textarea>
                    <i class="bi bi-journal-text input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="label-text">Profile Image URL</label>
                <div class="input-wrapper">
                    <input type="text" th:field="*{profileImageUrl}" class="custom-input" placeholder="https://example.com/your-photo.jpg">
                    <i class="bi bi-image input-icon"></i>
                </div>
                <div class="text-muted mt-2" style="font-size: 0.75rem;">
                    <i class="bi bi-info-circle me-1"></i> Paste a direct link to your author portrait.
                </div>
            </div>

            <div class="action-bar">
                <a th:href="@{/author/dashboard}" class="btn-custom btn-cancel">
                    Cancel
                </a>
                <button type="submit" class="btn-custom btn-save">
                    <i class="bi bi-check2-circle"></i> Save Profile
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
