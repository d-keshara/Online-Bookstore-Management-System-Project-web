<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow border-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-4">Edit Author Profile</h3>
            <form th:action="@{/author/update-profile}" th:object="${author}" method="post">
                <!-- This hidden ID is CRITICAL so it updates instead of creating a new one -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Display Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Biography</label>
                    <textarea th:field="*{biography}" class="form-control" rows="5"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Profile Image URL</label>
                    <input type="text" th:field="*{profileImageUrl}" class="form-control">
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/author/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
