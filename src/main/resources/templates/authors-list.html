<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Authors — Nexus Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { background: #f5f7fa; font-family: 'DM Sans', sans-serif; padding: 3rem; }
        .card-box { background: white; padding: 2.5rem; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.04); border-top: 4px solid #1a1a1a; }
        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; color: #1a1a1a; }
        .bio-text { max-width: 350px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #888; }
        .page-link { color: #1a1a1a; border-radius: 5px; margin: 0 5px; font-weight: 600; }
        .page-link:focus { box-shadow: none; }
    </style>
</head>
<body>

<div class="container" style="max-width: 1100px;">
    <div class="card-box">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <h2 class="page-title"><i class="bi bi-pen-fill text-secondary me-2"></i>Author Database</h2>
            <div>
                <a th:href="@{/admin/dashboard}" class="btn btn-light fw-bold px-4 rounded-pill me-2">Back to Dashboard</a>
                <a th:href="@{/admin/authors/add}" class="btn btn-dark fw-bold px-4 rounded-pill" style="background: #c8602a; border: none;">
                    <i class="bi bi-person-plus-fill me-1"></i> Register Author
                </a>
            </div>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show fw-bold border-0 shadow-sm">
            <i class="bi bi-check-circle-fill me-2"></i>Author saved successfully!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <table class="table table-hover align-middle mt-3">
            <thead class="table-light text-uppercase" style="font-size: 0.85rem; letter-spacing: 1px;">
            <tr>
                <th>ID</th>
                <th>Photo</th>
                <th>Author Name</th>
                <th>Biography Snippet</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="author : ${authors}">

                <td class="fw-bold text-muted" th:text="'#' + ${author.id}">#1</td>

                <td>
                    <img th:if="${author.profileImageUrl != null and !author.profileImageUrl.empty}"
                         th:src="${author.profileImageUrl}"
                         class="rounded-circle shadow-sm"
                         style="width: 45px; height: 45px; object-fit: cover; border: 2px solid #eee;">

                    <div th:unless="${author.profileImageUrl != null and !author.profileImageUrl.empty}"
                         class="rounded-circle bg-light d-flex justify-content-center align-items-center text-muted shadow-sm"
                         style="width: 45px; height: 45px; border: 2px solid #eee;">
                        <i class="bi bi-person"></i>
                    </div>
                </td>

                <td class="fw-bold text-dark fs-6">
                    <span th:text="${author.name}">Name</span>
                    <span th:if="${author.featuredOnHomePage != null and author.featuredOnHomePage}"
                          class="badge bg-warning text-dark ms-2" style="font-size: 0.65rem; vertical-align: middle;">
                        <i class="bi bi-star-fill"></i> VIP
                    </span>
                </td>

                <td class="bio-text" th:text="${#strings.abbreviate(author.biography != null ? author.biography : 'No bio provided.', 70)}">Bio</td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <form th:if="${author.featuredOnHomePage != null and author.featuredOnHomePage}"
                              th:action="@{/admin/authors/revoke/{id}(id=${author.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-warning text-dark fw-bold rounded-pill px-3" title="Remove from Home Page">
                                <i class="bi bi-star-half"></i> Remove VIP
                            </button>
                        </form>

                        <a th:href="@{/admin/authors/edit/{id}(id=${author.id})}" class="btn btn-sm btn-outline-dark fw-bold rounded-pill px-4">Edit</a>

                        <form th:action="@{/admin/authors/delete/{id}(id=${author.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-danger fw-bold rounded-pill px-3"
                                    onclick="return confirm('Permanently delete this author?');">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(authors)}">
                <td colspan="5" class="text-center text-muted py-4 fst-italic">No authors found in the registry.</td>
            </tr>
            </tbody>
        </table>

        <nav th:if="${totalPages > 0}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link shadow-none" th:href="@{/admin/authors/list(page=${currentPage - 1})}">
                        <i class="bi bi-chevron-left"></i> Previous
                    </a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link shadow-none" th:href="@{/admin/authors/list(page=${currentPage + 1})}">
                        Next <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
