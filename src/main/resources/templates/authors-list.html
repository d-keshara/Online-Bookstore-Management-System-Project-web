<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Authors - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Authors</h2>
        <div>
            <a href="/admin/authors/add" class="btn btn-primary fw-bold">+ Add New Author</a>
            <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
        Author saved successfully!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Photo</th>
            <th>Author Name</th>
            <th>Biography Snippet</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}">1</td>

            <td>
                <img th:if="${author.profileImageUrl != null and !author.profileImageUrl.empty}"
                     th:src="${author.profileImageUrl}"
                     alt="Author Image"
                     class="rounded-circle"
                     style="width: 40px; height: 40px; object-fit: cover;">
                <span th:unless="${author.profileImageUrl != null and !author.profileImageUrl.empty}" class="text-muted small">No Image</span>
            </td>

            <td class="fw-bold" th:text="${author.name}">Name</td>

            <td th:text="${#strings.abbreviate(author.biography != null ? author.biography : 'No bio provided.', 50)}">Bio</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/authors(page=${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/authors(page=${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
