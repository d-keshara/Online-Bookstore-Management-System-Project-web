<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Book - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a1a; --paper: #faf8f4; --paper-card: #ffffff;
            --accent: #c8602a; --border: rgba(0,0,0,0.09); --radius-lg: 8px;
        }
        body { background: var(--paper); font-family: 'DM Sans', sans-serif; color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .premium-card { background: var(--paper-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .form-control, .form-select { border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 4px; box-shadow: none !important; }
        .form-control:focus, .form-select:focus { border-color: var(--ink); }
        .form-label { font-weight: 600; color: var(--ink-soft); font-size: 0.9rem; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="mb-4 d-flex align-items-center gap-3">
        <a href="/admin/dashboard" class="btn btn-light border shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;"><i class="bi bi-arrow-left fs-5"></i></a>
        <h2 class="fw-bold font-playfair mb-0 text-dark">Add New Book to Inventory</h2>
    </div>

    <div class="premium-card p-4 p-md-5 mx-auto" style="max-width: 800px;">
        <form th:action="@{/admin/save}" th:object="${book}" method="post" enctype="multipart/form-data">

            <div class="row g-4 mb-4">
                <div class="col-md-7">
                    <label class="form-label">Book Title <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{title}" class="form-control" placeholder="Enter full book title" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Category <span class="text-danger">*</span></label>
                    <select th:field="*{category}" class="form-select" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Sci-Fi & Fantasy">Sci-Fi & Fantasy</option>
                        <option value="Mystery & Thriller">Mystery & Thriller</option>
                        <option value="Biography">Biography</option>
                        <option value="Educational">Educational</option>
                        <option value="Romance">Romance</option>
                        <option value="Computers & Technology">Computers & Technology</option>
                        <option value="History">History</option>
                        <option value="Children & YA">Children & YA</option>
                    </select>
                </div>
            </div>

            <div class="mb-4 pb-4 border-bottom">
                <label class="form-label">Select Author <span class="text-danger">*</span></label>
                <div class="d-flex gap-3">
                    <select th:field="*{author}" class="form-select" required>
                        <option value="" disabled selected>-- Choose an Author --</option>
                        <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}">Author Name</option>
                    </select>
                    <a href="/admin/authors/add" class="btn btn-outline-dark fw-bold text-nowrap">Add New Author</a>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Book Description / Synopsis <span class="text-danger">*</span></label>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted small">Enter a detailed summary for the book details page...</span>
                    <button type="button" id="aiEnhanceBtn" class="btn btn-sm text-white fw-bold shadow-sm" style="background: linear-gradient(45deg, #6b21a8, #c8602a);">
                        <i class="bi bi-stars"></i> Enhance with AI
                    </button>
                </div>
                <textarea th:field="*{description}" id="synopsisInput" class="form-control" rows="5" required placeholder="Type the rough draft here..."></textarea>
            </div>

            <div class="row g-4 mb-4 pb-4 border-bottom">
                <div class="col-md-6">
                    <label class="form-label">Retail Price (LKR) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-secondary">Rs.</span>
                        <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control border-secondary" required placeholder="0.00">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Initial Stock Quantity <span class="text-danger">*</span></label>
                    <input type="number" min="0" th:field="*{stock}" class="form-control border-secondary" required placeholder="e.g. 50">
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label">Book Cover Photo <span class="text-danger">*</span></label>
                <div class="p-5 text-center rounded" style="background: var(--paper-warm); border: 2px dashed rgba(0,0,0,0.15); transition: 0.2s;">
                    <i class="bi bi-cloud-arrow-up fs-1 text-secondary mb-3 d-block opacity-75"></i>
                    <input type="file" name="imageFile" id="imageFile" class="form-control w-75 mx-auto shadow-sm" accept="image/png, image/jpeg, image/jpg" required>
                    <div class="form-text mt-3 fw-bold text-muted">Recommended format: PNG or JPG. Max size: 5MB.</div>
                </div>
            </div>

            <div class="d-flex gap-3 justify-content-end pt-3">
                <a href="/admin/dashboard" class="btn btn-light border px-4 py-3 fw-bold text-dark">Cancel</a>
                <button type="submit" class="btn px-5 py-3 fw-bold shadow-sm" style="background: var(--ink); color: white;"><i class="bi bi-save me-2"></i> Save Book to Database</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('aiEnhanceBtn').addEventListener('click', async function() {
        const synopsisBox = document.getElementById('synopsisInput');
        const draftText = synopsisBox.value;
        const btn = this;

        if (draftText.trim().length < 10) {
            alert("Please write at least a few words so the AI has something to work with!");
            return;
        }

        const originalBtnHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Thinking...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/ai/enhance-synopsis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ draft: draftText })
            });
            const data = await response.json();
            if (data.enhanced) { synopsisBox.value = data.enhanced; }
            else { alert("AI Error: " + data.error); }
        } catch (error) {
            alert("Connection error. Make sure Ollama is running!");
        } finally {
            btn.innerHTML = originalBtnHtml;
            btn.disabled = false;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
