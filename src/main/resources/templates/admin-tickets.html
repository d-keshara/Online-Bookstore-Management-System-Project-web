<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Tickets - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Customer Support Tickets</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm border-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="'#' + ${ticket.ticketId}"></td>
                <td class="fw-bold" th:text="${ticket.user.username}"></td>
                <td th:text="${ticket.subject}"></td>
                <td th:text="${ticket.message}"></td>
                <td>
                    <span th:if="${ticket.status == 'OPEN'}" class="badge bg-warning text-dark">OPEN</span>
                    <span th:if="${ticket.status == 'RESOLVED'}" class="badge bg-success">RESOLVED</span>
                </td>
                <td>
                    <form th:if="${ticket.status == 'OPEN'}" th:action="@{'/admin/tickets/resolve/' + ${ticket.ticketId}}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-success">Mark Resolved</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
