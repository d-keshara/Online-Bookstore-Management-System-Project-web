<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Tickets - Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888;
            --paper: #faf8f4; --paper-card: #ffffff;
            --accent: #c8602a;
        }

        body {
            background: linear-gradient(135deg, #f0f2f5 0%, #e2e8f0 100%);
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; animation: fadeInUp 0.4s ease forwards; }
        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--ink); margin: 0; }

        .btn-top-light { background: white; color: var(--ink); border: 1px solid rgba(0,0,0,0.1); border-radius: 50px; padding: 10px 24px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-top-light:hover { background: #f0f0f0; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); color: var(--ink); }

        .premium-card { background: var(--paper-card); border-radius: 12px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.04); animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* 🎨 Custom Premium Table (Matched to Dashboard) */
        .table-premium { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: -8px; }
        .table-premium th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); border: none; padding: 12px 20px; font-weight: 600; }
        .table-premium td { background: #fafafa; border: none; padding: 16px 20px; vertical-align: middle; color: var(--ink-soft); transition: 0.3s; }
        .table-premium tr:hover td { background: #f5f6f8; transform: scale(1.002); }
        .table-premium td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .table-premium td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        .data-id { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 1.05rem; color: var(--ink-muted); background: rgba(0,0,0,0.04); padding: 4px 8px; border-radius: 4px; }
        .customer-name { font-weight: 700; color: var(--ink); font-size: 1.05rem; font-family: 'Playfair Display', serif; }

        .badge-open { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid #dc3545; padding: 6px 12px; font-weight: 700; letter-spacing: 1px; }
        .badge-resolved { background: rgba(25, 135, 84, 0.1); color: #198754; border: 1px solid #198754; padding: 6px 12px; font-weight: 700; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 1200px;">

    <div class="dashboard-header">
        <h2 class="page-title"><i class="bi bi-headset text-primary me-2"></i> Support Tickets</h2>
        <a th:href="@{/admin/dashboard}" class="btn-top-light">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-3 small fw-bold shadow-sm border-0 mb-4" style="background: #e8f4eb; color: #1e4620; border-left: 4px solid #198754 !important; animation: fadeInUp 0.5s ease;">
        <i class="bi bi-check-circle-fill me-2 fs-6 align-middle"></i> <span th:text="${successMessage}"></span>
    </div>

    <div class="premium-card">
        <div class="table-responsive" style="overflow-x: visible;">
            <table class="table-premium">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Subject</th>
                    <th style="width: 35%;">Message</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td><span class="data-id" th:text="'#' + ${ticket.id}"></span></td>
                    <td><span class="customer-name" th:text="${ticket.user.username}"></span></td>
                    <td class="fw-bold" th:text="${ticket.subject}"></td>
                    <td class="small text-muted" th:text="${ticket.message}"></td>
                    <td>
                        <span th:if="${ticket.status == 'OPEN'}" class="badge rounded-pill badge-open">OPEN</span>
                        <span th:if="${ticket.status == 'RESOLVED'}" class="badge rounded-pill badge-resolved">RESOLVED</span>
                    </td>
                    <td class="text-end pe-3">
                        <div class="d-flex align-items-center justify-content-end gap-2">
                            <form th:if="${ticket.status == 'OPEN'}" th:action="@{'/admin/tickets/resolve/' + ${ticket.id}}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-success fw-bold rounded-pill px-3 shadow-sm" onclick="return confirm('Mark this ticket as resolved?');">
                                    <i class="bi bi-check2-circle me-1"></i> Resolve
                                </button>
                            </form>

                            <span th:if="${ticket.status == 'RESOLVED'}" class="text-muted small fw-bold px-2">
                                <i class="bi bi-check-all fs-5 text-success"></i>
                            </span>

                            <form th:action="@{'/admin/tickets/delete/' + ${ticket.id}}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm fw-bold rounded-pill px-3 shadow-sm" style="background: #fde8e8; color: #b83232; border: 1px solid #f5c6cb;" onclick="return confirm('Are you sure you want to permanently delete this ticket?');">
                                    <i class="bi bi-trash3 me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${tickets == null or tickets.empty}">
                    <td colspan="6" class="text-center py-5 text-muted bg-transparent">
                        <i class="bi bi-inbox fs-1 d-block mb-3 opacity-25"></i>
                        <span class="fw-medium font-playfair fs-5">No support tickets found.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
