<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Support - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1a1a; --ink-soft: #3d3d3d;
            --paper: #faf8f4; --paper-card: #ffffff;
            --accent: #c8602a; --accent-dark: #9e4a1e;
        }

        body {
            background: var(--paper);
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-card {
            background: var(--paper-card);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Top orange accent line */
        .premium-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, #e67e22 100%);
        }

        h3 { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--ink); }

        .form-control { border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); padding: 12px 15px; transition: 0.3s; font-size: 0.95rem; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(200,96,42,0.1); }
        .form-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); }

        .btn-accent { background: var(--accent); color: white; border-radius: 8px; font-weight: 600; letter-spacing: 0.5px; transition: 0.3s; border: none; }
        .btn-accent:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 15px rgba(200,96,42,0.2); color: white; }

        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.2s; margin-bottom: 1.5rem; }
        .btn-back:hover { color: var(--accent); transform: translateX(-5px); }
    </style>
</head>
<body>

<div class="container" style="max-width: 600px;">

    <a th:href="@{/catalog}" class="btn-back">
        <i class="bi bi-arrow-left"></i> Back to Catalog
    </a>

    <div th:if="${successMessage}" class="alert alert-success py-3 small fw-bold shadow-sm border-0 mb-4" style="background: #e8f4eb; color: #1e4620; border-left: 4px solid #198754 !important; animation: fadeInUp 0.5s ease;">
        <i class="bi bi-check-circle-fill me-2 fs-6 align-middle"></i> <span th:text="${successMessage}"></span>
    </div>

    <div class="premium-card p-4 p-md-5">
        <h3 class="mb-2">How can we help?</h3>
        <p class="text-muted mb-4 pb-2 border-bottom">Submit a support ticket and our librarian team will get back to you shortly.</p>

        <form th:action="@{/contact/submit}" th:object="${ticket}" method="post">
            <div class="mb-4">
                <label class="form-label fw-bold">Subject</label>
                <div class="input-group shadow-sm rounded-3">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-chat-left-text"></i></span>
                    <input type="text" th:field="*{subject}" class="form-control border-start-0 ps-0" required placeholder="E.g. Where is my book order?">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Message</label>
                <textarea th:field="*{message}" class="form-control shadow-sm" rows="5" required placeholder="Describe your issue in detail..."></textarea>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-3 mt-2"><i class="bi bi-send-fill me-2"></i> Submit Ticket</button>
        </form>
    </div>
</div>

</body>
</html>
