<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Support - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h3 class="mb-4">Submit a Support Ticket</h3>
            <form th:action="@{/contact/submit}" th:object="${ticket}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Subject</label>
                    <input type="text" th:field="*{subject}" class="form-control" required placeholder="E.g. Where is my book?">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Message</label>
                    <textarea th:field="*{message}" class="form-control" rows="5" required placeholder="Describe your issue..."></textarea>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">Submit Ticket</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
