<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Author - Nexus Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 shadow-sm rounded" style="max-width: 600px;">

  <!-- NEW: Success Message Alert -->
  <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Success!</strong> The author has been successfully saved to the database.
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <h2 class="mb-4 text-primary fw-bold">Register New Author</h2>

  <form th:action="@{/admin/authors/save}" th:object="${author}" method="post">

    <div class="mb-3">
      <label class="form-label fw-bold">Author Full Name</label>
      <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. J.K. Rowling">
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Biography</label>
      <textarea th:field="*{biography}" class="form-control" rows="4" placeholder="Brief history of the author..."></textarea>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">Profile Image URL</label>
      <input type="url" th:field="*{profileImageUrl}" class="form-control" placeholder="https://example.com/image.jpg">
      <div class="form-text">Paste a link to the author's photo (optional).</div>
    </div>

    <div class="d-flex gap-2 pt-3 border-top">
      <button type="submit" class="btn btn-primary px-4 fw-bold">Save Author</button>
      <!-- Updated cancel link to go back to dashboard -->
      <a href="/admin/dashboard" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>

<!-- Need Bootstrap JS for the closeable alert to work -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
