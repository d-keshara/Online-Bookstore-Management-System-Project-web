<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Request Publication - Author Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Simple Author Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/author/dashboard">Nexus Author Portal</a>
    <a href="/author/dashboard" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
  </div>
</nav>

<div class="container mt-5 mb-5" style="max-width: 700px;">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0 fw-bold"><i class="bi bi-journal-plus me-2"></i>Submit a New Book</h4>
    </div>

    <div class="card-body p-4 p-md-5">
      <div class="alert alert-info mb-4 border-0 bg-info bg-opacity-10 text-dark">
        <i class="bi bi-info-circle-fill me-2 text-info"></i>
        <strong>How it works:</strong> Submit your book details below. Our administrative team will review your submission, determine retail pricing, upload cover art, and publish it to the storefront.
      </div>

      <!-- Form submits to our new POST method -->
      <form th:action="@{/author/books/request/save}" th:object="${book}" method="post">

        <div class="mb-4">
          <label class="form-label fw-bold">Book Title</label>
          <input type="text" th:field="*{title}" class="form-control form-control-lg bg-light" required placeholder="Enter the official title" />
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Genre / Category</label>
          <select th:field="*{category}" class="form-select bg-light" required>
            <option value="" disabled selected>Select a category...</option>
            <option value="Fiction">Fiction</option>
            <option value="Non-Fiction">Non-Fiction</option>
            <option value="Sci-Fi & Fantasy">Sci-Fi & Fantasy</option>
            <option value="Mystery & Thriller">Mystery & Thriller</option>
            <option value="Biography">Biography</option>
            <option value="Educational">Educational</option>
            <option value="Romance">Romance</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Book Description</label>
          <textarea th:field="*{description}" class="form-control bg-light" rows="5" required placeholder="Write a compelling synopsis for your readers..."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
          <a href="/author/dashboard" class="btn btn-light fw-bold px-4">Cancel</a>
          <button type="submit" class="btn btn-primary fw-bold px-4"><i class="bi bi-send-fill me-2"></i>Submit for Review</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
