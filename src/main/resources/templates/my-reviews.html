<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reviews — Nexus Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
        --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888;
        --paper: #faf8f4; --paper-card: #ffffff;
        --accent: #c8602a; --accent-dark: #9e4a1e;
    }

    body {
        background: linear-gradient(135deg, var(--paper) 0%, #e9e4dc 100%);
        font-family: 'DM Sans', sans-serif;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
    }

    /* ✨ Premium Animations */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .dashboard-wrapper {
        width: 100%;
        max-width: 1200px;
        display: flex;
        gap: 2rem;
        margin: auto;
    }

    /* 🟦 Premium Dark Sidebar */
    .dashboard-sidebar {
        width: 280px;
        background: linear-gradient(135deg, var(--ink) 0%, #2a2a2a 100%);
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        color: white;
        animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
        overflow: hidden;
        height: fit-content;
    }

    .dashboard-sidebar::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at bottom left, rgba(200,96,42,0.15) 0%, transparent 70%);
        pointer-events: none;
    }

    .sidebar-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 2.5rem;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 1.5rem;
        z-index: 2;
        position: relative;
    }

    .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 1;
        position: relative;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 8px;
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .nav-item:hover {
        color: white;
        background: rgba(255,255,255,0.05);
    }

    .nav-item.active {
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 15px rgba(200,96,42,0.3);
    }

    .nav-item i { font-size: 1.2rem; }

    /* ⬜ Main Content Area */
    .dashboard-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .premium-card {
        background: var(--paper-card);
        border-radius: 12px;
        padding: 3rem 4rem;
        box-shadow: 0 25px 50px rgba(0,0,0,0.05);
        animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.2s;
        opacity: 0;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        border-bottom: 2px solid var(--paper);
        padding-bottom: 15px;
    }

    .section-title {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--ink);
        margin: 0;
    }

    .badge-reviews {
        background: rgba(200,96,42,0.1);
        color: var(--accent);
        border: 1px solid rgba(200,96,42,0.2);
        font-weight: 600;
        padding: 6px 12px;
    }

    /* 🎨 Custom Premium Table */
    .table-premium {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 10px;
        margin-top: -10px;
    }

    .table-premium th {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--ink-muted);
        border: none;
        padding: 10px 20px;
        font-weight: 600;
    }

    .table-premium td {
        background: #fafafa;
        border: none;
        padding: 20px;
        vertical-align: middle;
        color: var(--ink-soft);
        transition: 0.3s;
    }

    .table-premium tr:hover td {
        background: #f0f0f0;
        transform: scale(1.005);
    }

    .table-premium td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    .table-premium td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

    .book-title {
        font-family: 'Playfair Display', serif;
        font-weight: 600;
        color: var(--ink);
        font-size: 1.05rem;
        text-decoration: none;
    }

    .book-title:hover { color: var(--accent); }

    .star-rating i { color: #ffc107; font-size: 0.9rem; }

    /* Staggered Row Animations */
    .table-premium tbody tr { animation: fadeInUp 0.5s ease forwards; opacity: 0; }
    .table-premium tbody tr:nth-child(1) { animation-delay: 0.3s; }
    .table-premium tbody tr:nth-child(2) { animation-delay: 0.4s; }
    .table-premium tbody tr:nth-child(3) { animation-delay: 0.5s; }
    .table-premium tbody tr:nth-child(4) { animation-delay: 0.6s; }
    .table-premium tbody tr:nth-child(5) { animation-delay: 0.7s; }

    /* Buttons */
    .btn-action {
        width: 35px;
        height: 35px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: 0.2s;
    }

    /* Top Bar Navigation */
    .top-bar {
        position: absolute;
        top: 2rem;
        right: 3rem;
        z-index: 100;
        display: flex;
        gap: 12px;
    }

    .btn-top {
        border-radius: 50px;
        padding: 8px 20px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        transition: 0.3s;
    }

    .btn-top-light { background: white; color: var(--ink); border: 1px solid rgba(0,0,0,0.1); }
    .btn-top-light:hover { background: #f0f0f0; }

    .btn-top-dark { background: var(--ink); color: white; border: none; }
    .btn-top-dark:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(200,96,42,0.2); }

    @media (max-width: 992px) {
        .dashboard-wrapper { flex-direction: column; }
        .dashboard-sidebar { width: 100%; padding: 1.5rem; }
        .sidebar-brand { display: none; }
        .sidebar-nav { flex-direction: row; justify-content: space-between; overflow-x: auto; }
        .nav-item { padding: 10px; font-size: 0.9rem; }
        .premium-card { padding: 2rem; }
        .top-bar { display: none; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a th:href="@{/my-account}" class="btn-top btn-top-light text-decoration-none">
    <i class="bi bi-person-circle me-1 text-muted"></i> My Account
  </a>
  <a th:href="@{/cart}" class="btn-top btn-top-light text-decoration-none">
    <i class="bi bi-cart3 me-1 text-muted"></i> Cart
  </a>
  <a th:href="@{/catalog}" class="btn-top btn-top-dark text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i> Back to Shop
  </a>
</div>

<div class="dashboard-wrapper">

  <aside class="dashboard-sidebar">
    <div class="sidebar-brand">NEXUS</div>
    <nav class="sidebar-nav">
      <a th:href="@{/my-account}" class="nav-item">
        <i class="bi bi-person-circle"></i> Account Details
      </a>
      <a th:href="@{/my-orders}" class="nav-item">
        <i class="bi bi-box-seam"></i> My Orders
      </a>
      <a th:href="@{/my-reviews}" class="nav-item active">
        <i class="bi bi-star"></i> My Reviews
      </a>
      <a th:href="@{/logout}" class="nav-item mt-4 text-danger opacity-75">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </nav>
  </aside>

  <main class="dashboard-content">

    <div class="premium-card">
      <div class="section-header">
        <h3 class="section-title h4">Review History</h3>
        <span class="badge badge-reviews rounded-pill" th:text="${reviews.size() + ' Reviews Written'}">0 Reviews</span>
      </div>

      <div class="table-responsive" style="overflow-x: visible;">
        <table class="table-premium">
          <thead>
          <tr>
            <th>Book Title</th>
            <th>Rating</th>
            <th>Comment</th>
            <th>Date</th>
            <th class="text-center">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="review : ${reviews}">
            <td>
              <a th:href="@{/catalog/details/{id}(id=${review.book.bookId})}" class="book-title" th:text="${review.book.title}">Book Title</a>
            </td>
            <td>
              <div class="star-rating">
                <span th:each="i : ${#numbers.sequence(1, review.rating)}"><i class="bi bi-star-fill"></i></span>
              </div>
            </td>
            <td>
              <span class="text-muted small" th:text="${review.comment}">The comment goes here...</span>
            </td>
            <td class="text-muted small fw-medium" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}">Date</td>
            <td class="text-center">
              <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/reviews/edit/{id}(id=${review.reviewId})}" class="btn btn-outline-secondary btn-action" title="Edit Review">
                  <i class="bi bi-pencil-square"></i>
                </a>

                <form th:action="@{/reviews/delete/{id}(id=${review.reviewId})}" method="post" onsubmit="return confirm('Are you sure you want to delete this review?');" style="display: inline;">
                  <button type="submit" class="btn btn-outline-danger btn-action border-0 bg-danger bg-opacity-10 text-danger" title="Delete Review">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(reviews)}">
            <td colspan="5" class="text-center py-5 bg-transparent">
              <i class="bi bi-journal-x opacity-25 mb-3" style="font-size: 3.5rem; color: var(--ink);"></i>
              <h5 class="font-playfair fw-bold text-dark">No Reviews Yet</h5>
              <p class="text-muted small mb-4">You haven't shared your thoughts on any books.</p>
              <a href="/catalog" class="btn btn-dark px-4 py-2 rounded-pill fw-semibold shadow-sm text-decoration-none">
                Browse Catalog
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
