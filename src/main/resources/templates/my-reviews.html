<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Reviews - Nexus Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .star-rating { color: #ffc107; }
    .table-v-align td { vertical-align: middle; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/catalog">NEXUS BOOKSTORE</a>
    <a href="/catalog" class="btn btn-outline-light btn-sm">Back to Shop</a>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">My Reviews</h2>
    <span class="badge bg-primary px-3 py-2" th:text="${reviews.size() + ' Reviews Written'}">0 Reviews</span>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-v-align">
          <thead class="table-light">
          <tr>
            <th class="ps-4">Book Title</th>
            <th>Rating</th>
            <th>Comment</th>
            <th>Date</th>
            <th class="text-center">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="review : ${reviews}">
            <td class="ps-4">
              <a th:href="@{/catalog/details/{id}(id=${review.book.bookId})}"
                 class="fw-bold text-decoration-none text-dark"
                 th:text="${review.book.title}">Book Title</a>
            </td>
            <td>
              <div class="star-rating">
                <span th:each="i : ${#numbers.sequence(1, review.rating)}">★</span>
              </div>
            </td>
            <td class="text-muted" th:text="${review.comment}">The comment goes here...</td>
            <td th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}">Date</td>
            <td class="text-center">
              <div class="btn-group">
                <!-- FIXED: Changed review.id to review.reviewId -->
                <a th:href="@{/reviews/edit/{id}(id=${review.reviewId})}" class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil"></i>
                </a>

                <!-- FIXED: Changed review.id to review.reviewId -->
                <form th:action="@{/reviews/delete/{id}(id=${review.reviewId})}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this review?');"
                      style="display: inline;">
                  <button type="submit" class="btn btn-sm btn-outline-danger" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(reviews)}">
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="bi bi-chat-left-dots" style="font-size: 2rem;"></i>
              <p class="mt-2">You haven't written any reviews yet.</p>
              <a href="/catalog" class="btn btn-primary btn-sm mt-2">Browse Catalog</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
