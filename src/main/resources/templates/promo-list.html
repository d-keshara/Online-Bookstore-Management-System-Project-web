<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Promos — Nexus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-muted: #888; --paper-card: #ffffff; --accent: #c8602a; }
        body { background: linear-gradient(135deg, #f0f2f5 0%, #e2e8f0 100%); font-family: 'DM Sans', sans-serif; color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 3rem 1rem; }

        /* ✨ Premium Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

        .dashboard-wrapper { width: 100%; max-width: 1350px; display: flex; gap: 2rem; margin: auto; }

        /* 🟦 SIDEBAR */
        .dashboard-sidebar { width: 280px; background: linear-gradient(135deg, var(--ink) 0%, #000000 100%); border-radius: 12px; padding: 2.5rem 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.15); color: white; animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: sticky; top: 2rem; height: calc(100vh - 4rem); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 2.5rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.5rem; color: #fff; }
        .sidebar-brand span { color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 0.7rem; display: block; letter-spacing: 3px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 500; transition: all 0.3s ease; margin-bottom: 0.5rem; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; box-shadow: inset 3px 0 0 var(--accent); }

        /* ⬜ Main Content Area */
        .dashboard-content { flex: 1; display: flex; flex-direction: column; gap: 2rem; }
        .premium-card { background: var(--paper-card); border-radius: 12px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.04); animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .section-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--ink); margin-bottom: 1.5rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }

        /* 🎨 Custom Premium Table */
        .table-premium { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: -8px; }
        .table-premium th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); border: none; padding: 12px 20px; font-weight: 600; }
        .table-premium td { background: #fafafa; border: none; padding: 16px 20px; vertical-align: middle; color: var(--ink-soft); transition: 0.3s; }
        .table-premium tr:hover td { background: #f5f6f8; transform: scale(1.002); }
        .table-premium td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .table-premium td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        .promo-badge { font-family: monospace; font-size: 1.1rem; letter-spacing: 2px; padding: 6px 12px; background: #fff3cd; color: #856404; border: 1px dashed #ffeeba; }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">NEXUS<span>ADMINISTRATOR</span></div>
        <nav style="flex: 1; overflow-y: auto; padding-right: 5px;">
            <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-collection"></i> Inventory Hub</a>
            <a th:href="@{/admin/requests}" class="nav-item"><i class="bi bi-journal-plus"></i> Book Requests</a>
            <a th:href="@{/admin/users}" class="nav-item"><i class="bi bi-people"></i> User Management</a>
            <a th:href="@{/admin/orders/manage}" class="nav-item"><i class="bi bi-box-seam"></i> Orders</a>
            <a th:href="@{/admin/authors/list}" class="nav-item"><i class="bi bi-pen"></i> Authors</a>
            <a th:href="@{/admin/announcements/list}" class="nav-item"><i class="bi bi-megaphone"></i> Announcements</a>
            <a th:href="@{/admin/promos/list}" class="nav-item active"><i class="bi bi-ticket-perforated"></i> Promo Codes</a>
        </nav>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; margin-top: 1rem;">
            <a th:href="@{/admin/dashboard}" class="nav-item text-white-50"><i class="bi bi-arrow-left"></i> Back to Dash</a>
        </div>
    </aside>

    <main class="dashboard-content">
        <div th:if="${successMessage}" class="alert alert-success py-3 small fw-bold shadow-sm border-0 mb-0" style="background: #e8f4eb; color: #1e4620; border-left: 4px solid #198754 !important; animation: fadeInUp 0.5s ease;">
            <i class="bi bi-check-circle-fill me-2 fs-6 align-middle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert"></button>
        </div>

        <div class="premium-card">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h4 class="section-title border-0 mb-0"><i class="bi bi-tags-fill text-warning me-2"></i>Active Promotions</h4>
                <a th:href="@{/admin/promos/add}" class="btn btn-dark fw-bold px-4 shadow-sm" style="border-radius: 50px; background: var(--accent); border: none;">
                    <i class="bi bi-plus-lg me-1"></i> Generate Promo
                </a>
            </div>

            <div class="table-responsive" style="overflow-x: visible;">
                <table class="table-premium">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Discount (%)</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="promo : ${promos}">
                        <td><span class="badge promo-badge text-uppercase" th:text="${promo.code}"></span></td>
                        <td class="fw-bold text-success fs-5" th:text="${promo.discountPercentage} + '%'"></td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded-pill" th:if="${promo.active}">Active</span>
                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 rounded-pill" th:if="${!promo.active}">Expired</span>
                        </td>
                        <td class="text-end pe-3">
                            <form th:action="@{/admin/promos/delete/{id}(id=${promo.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-light border text-danger btn-sm px-3 fw-bold rounded shadow-sm" onclick="return confirm('Revoke this code?')"><i class="bi bi-trash3-fill me-1"></i> Revoke</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(promos)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 opacity-25 d-block mb-3"></i>
                            <span class="fw-medium font-playfair fs-5">No active promo codes. Generate one to boost sales!</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
