<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="container bg-white p-5 shadow-sm rounded" style="max-width: 600px; margin-top: 50px; margin-bottom: 50px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Create an Account</h2>
        <p class="text-muted">Join Nexus Bookstore today!</p>
    </div>

    <!-- Added an ID to the form so our JavaScript can grab it -->
    <form id="registerForm" th:action="@{/register/save}" th:object="${user}" method="post">

        <h5 class="mb-3 border-bottom pb-2">Account Details</h5>

        <div class="mb-3">
            <label class="form-label fw-bold">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required placeholder="Choose a username">
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Password</label>
                <!-- Added an ID to the password box -->
                <input type="password" id="password" th:field="*{password}" class="form-control" required placeholder="Create a password">
                <small class="text-muted" style="font-size: 0.8em;">Min. 8 chars & 2 symbols (!@#$ etc.)</small>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Confirm Password</label>
                <!-- New Confirm Password box (Not bound to the database object) -->
                <input type="password" id="confirmPassword" class="form-control" required placeholder="Repeat password">
                <!-- Hidden error message that JavaScript will trigger -->
                <small id="passwordError" class="text-danger fw-bold mt-1" style="display: none; font-size: 0.85em;"></small>
            </div>
        </div>

        <h5 class="mb-3 border-bottom pb-2">Personal Information</h5>
        <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" th:field="*{fullName}" class="form-control" required placeholder="John Doe">
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+94 77 123 4567">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Shipping Address</label>
            <textarea th:field="*{address}" class="form-control" rows="2" required placeholder="Enter your full delivery address"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Create Account</button>

        <div class="text-center mt-3">
            <p class="text-muted">Already have an account? <a href="/login" class="text-decoration-none">Sign in here</a>.</p>
        </div>
    </form>
</div>

<!-- JAVASCRIPT: Validates the password rules before letting the form submit -->
<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const errorText = document.getElementById("passwordError");

        // This regex counts how many special symbols are in the password
        const symbolCount = (password.match(/[^a-zA-Z0-9]/g) || []).length;

        // 1. Check Length
        if (password.length < 8) {
            event.preventDefault(); // Stops the form from submitting
            errorText.textContent = "Must be at least 8 characters.";
            errorText.style.display = "block";
            return;
        }

        // 2. Check Symbol Count
        if (symbolCount < 2) {
            event.preventDefault();
            errorText.textContent = "Must contain at least 2 symbols.";
            errorText.style.display = "block";
            return;
        }

        // 3. Check if they match
        if (password !== confirmPassword) {
            event.preventDefault();
            errorText.textContent = "Passwords do not match.";
            errorText.style.display = "block";
            return;
        }

        // If it passes all tests, hide any errors and let it submit naturally!
        errorText.style.display = "none";
    });
</script>

</body>
</html>
