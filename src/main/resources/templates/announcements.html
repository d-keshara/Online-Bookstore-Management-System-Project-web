<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News & Announcements — Nexus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        :root{
            --ink:#1a1a1a;
            --ink-soft:#3d3d3d;
            --ink-muted:#888;
            --accent:#c8602a;
        }

        body{
            background:linear-gradient(135deg,#f0f2f5 0%,#e2e8f0 100%);
            font-family:'DM Sans',sans-serif;
            min-height:100vh;
            padding:4rem 1rem;
        }

        .page-header{
            text-align:center;
            margin-bottom:3rem;
        }

        .page-header h1{
            font-family:'Playfair Display',serif;
            font-size:2.8rem;
            font-weight:700;
        }

        .article-card{
            background:white;
            border-radius:14px;
            padding:2.5rem;
            margin-bottom:1.5rem;
            box-shadow:0 10px 30px rgba(0,0,0,.05);
            border-left:4px solid var(--accent);
        }

        .article-title{
            font-family:'Playfair Display',serif;
            font-size:1.6rem;
            font-weight:700;
        }

        .article-date{
            color:var(--ink-muted);
            font-size:.85rem;
            margin-bottom:1rem;
        }

        .article-content{
            line-height:1.8;
            white-space:pre-wrap;
        }

        .empty-state{
            text-align:center;
            padding:5rem 0;
        }

        .back-btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            background:#1a1a1a;
            color:white;
            padding:10px 22px;
            border-radius:50px;
            text-decoration:none;
            margin-bottom:2rem;
        }

        .back-btn:hover{
            background:var(--accent);
            color:white;
        }
    </style>
</head>

<body>

<div class="container" style="max-width:900px;">

    <a th:href="@{/catalog}" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        Back to Catalog
    </a>

    <div class="page-header">

        <h1>
            <i class="bi bi-newspaper me-2"></i>
            News & Announcements
        </h1>

        <p class="text-muted">
            Latest updates from the Nexus team.
        </p>

    </div>

    <div th:if="${#lists.isEmpty(announcements)}"
         class="empty-state">

        <h3>No announcements yet</h3>

    </div>

    <div th:each="announcement : ${announcements}"
         class="article-card">

        <h2 class="article-title"
            th:text="${announcement.title}">
        </h2>

        <p class="article-date">

            <i class="bi bi-calendar3"></i>

            <span th:text="${announcement.datePosted}"></span>

        </p>

        <div class="article-content"
             th:text="${announcement.content}">
        </div>

    </div>

</div>

</body>
</html>
