<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Books - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="fw-bold mb-4">My Published Books</h2>
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${author.books}">
                    <td th:text="${book.title}">Book Title</td>
                    <td th:text="${book.category}">Category</td>
                    <td th:text="${book.price}">0.00</td>
                </tr>
                </tbody>
            </table>
            <a th:href="@{/author/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
