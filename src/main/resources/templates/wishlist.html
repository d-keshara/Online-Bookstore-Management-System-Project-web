<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>❤️ My Wishlist</h2>
    <hr>

    <div id="wishlist-container" class="row">
        <p>Loading your saved books...</p>
    </div>
</div>

<script>
    // HARDCODED FOR TESTING: Replace with actual logged-in user ID
    const currentUserId = 1;

    // Function to load the wishlist when the page opens
    async function loadWishlist() {
        const container = document.getElementById('wishlist-container');
        try {
            const response = await fetch(`/api/wishlist/${currentUserId}`);
            const wishlists = await response.json();

            container.innerHTML = ""; // Clear the loading text

            if (wishlists.length === 0) {
                container.innerHTML = "<p>Your wishlist is empty. Go save some books!</p>";
                return;
            }

            // Loop through the data and create HTML cards for each book
            wishlists.forEach(item => {
                const book = item.book;
                const cardHtml = `
                    <div class="col-md-3 mb-4" id="wishlist-item-${book.bookId}">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body text-center">
                                <h5 class="card-title">${book.title}</h5>
                                <p class="card-text text-muted">${book.category}</p>
                                <h6 class="text-success">$${book.price}</h6>
                                <button onclick="removeFromWishlist(${book.bookId})" class="btn btn-danger btn-sm mt-2">
                                    ❌ Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        } catch (error) {
            container.innerHTML = "<p class='text-danger'>Error loading wishlist. Is the server running?</p>";
        }
    }

    // Function to delete a book from the wishlist
    async function removeFromWishlist(bookId) {
        if (!confirm("Are you sure you want to remove this book?")) return;

        try {
            const response = await fetch(`/api/wishlist/remove/${currentUserId}/${bookId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                // Instantly remove the card from the screen without refreshing the page!
                document.getElementById(`wishlist-item-${bookId}`).remove();
            } else {
                alert("Failed to remove book.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    // Run the load function immediately when the page starts
    loadWishlist();
</script>

</body>
</html>
