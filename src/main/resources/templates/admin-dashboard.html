<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Nexus Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .table-container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border-radius: 10px; }
        .navbar-brand { letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">NEXUS ADMIN PANEL</a>
        <div class="d-flex align-items-center gap-3">
            <a href="/admin/users" class="btn btn-warning btn-sm fw-bold text-dark shadow-sm">⚙️ Manage Users</a>
            <a href="/catalog" class="btn btn-outline-light btn-sm">Public Catalog</a>
            <form th:action="@{/logout}" method="post" class="m-0"><button type="submit" class="btn btn-danger btn-sm">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Success Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}" class="fw-bold"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ══ SECTION 1: AUTHOR INVITE CODES ══ -->
    <div class="card shadow-sm border-0 mb-5">
        <!-- Exact Restored Header Style[cite: 3] -->
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3 rounded-top">
            <h5 class="mb-0 fw-bold"><i class="bi bi-key-fill text-warning me-2"></i>Author Invite Codes</h5>
            <form th:action="@{/admin/tokens/generate}" method="post" class="m-0">
                <button type="submit" class="btn btn-warning fw-bold shadow-sm">+ Generate New Code</button>
            </form>
        </div>
        <div class="card-body bg-white border border-top-0 rounded-bottom">
            <h6 class="text-muted fw-bold mb-3">Available / Unused Codes:</h6>
            <ul class="list-group shadow-sm">
                <li th:each="token : ${unusedTokens}" class="list-group-item d-flex justify-content-between align-items-center bg-light">
                    <span class="fw-bold text-danger fs-5" th:text="${token.token}" style="font-family: monospace;"></span>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-secondary text-white rounded-pill px-3 py-2">Awaiting Author</span>
                        <form th:action="@{'/admin/tokens/delete/' + ${token.id}}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-outline-danger shadow-none" onclick="return confirm('Revoke this code?')">
                                <i class="bi bi-trash3-fill"></i> Revoke
                            </button>
                        </form>
                    </div>
                </li>
                <li th:if="${unusedTokens.isEmpty()}" class="list-group-item text-muted text-center py-4 bg-light">
                    No active invite codes.
                </li>
            </ul>
        </div>
    </div>

    <!-- ══ SECTION 2: INVENTORY MANAGEMENT ══ -->
    <div class="d-flex justify-content-between align-items-center mb-4 mt-5 border-top pt-4">
        <h2 class="fw-bold">Inventory Management</h2>
        <div class="d-flex gap-2">
            <!-- Order Command Center Button -->
            <a href="/admin/orders/manage" class="btn btn-dark px-4 fw-bold shadow-sm">
                <i class="bi bi-cart-check-fill me-1"></i> Manage Customer Orders
            </a>
            <a href="/admin/requests" class="btn btn-warning px-4 fw-bold text-dark border-warning shadow-sm">
                <i class="bi bi-bell-fill me-1"></i> Review Submissions
            </a>
            <a href="/admin/add" class="btn btn-success px-4 shadow-sm">+ Add Book</a>
        </div>
    </div>

    <div class="table-container shadow-sm mb-5">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Price</th><th>Stock</th><th class="text-center">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.bookId}"></td>
                <td class="fw-bold" th:text="${book.title}"></td>
                <td th:text="${book.author != null ? book.author.name : 'Unknown'}"></td>
                <td><span class="badge bg-info text-dark" th:text="${book.category}"></span></td>
                <td class="text-success fw-bold" th:text="${book.price}"></td>
                <td th:text="${book.stock}"></td>
                <td class="text-center">
                    <div class="btn-group">
                        <a th:href="@{'/admin/edit/' + ${book.bookId}}" class="btn btn-primary btn-sm px-3">Edit</a>
                        <a th:href="@{'/admin/delete/' + ${book.bookId}}" class="btn btn-danger btn-sm px-3" onclick="return confirm('Delete this book?')">Delete</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
