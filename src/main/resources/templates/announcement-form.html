<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Editor — Nexus Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --ink:#1a1a1a;
            --ink-soft:#3d3d3d;
            --ink-muted:#888;
            --paper-card:#fff;
            --accent:#c8602a;
        }

        body{
            background:linear-gradient(135deg,#f0f2f5 0%,#e2e8f0 100%);
            font-family:'DM Sans',sans-serif;
            min-height:100vh;
            padding:3rem 1rem;
        }

        .dashboard-wrapper{
            width:100%;
            max-width:1300px;
            margin:auto;
            display:flex;
            gap:2rem;
        }

        .dashboard-sidebar{
            width:280px;
            background:linear-gradient(135deg,var(--ink) 0%,#000 100%);
            border-radius:14px;
            padding:2rem;
            color:white;
        }

        .sidebar-brand{
            font-family:'Playfair Display',serif;
            font-size:1.7rem;
            font-weight:700;
            margin-bottom:2rem;
            border-bottom:1px solid rgba(255,255,255,0.1);
            padding-bottom:1rem;
        }

        .sidebar-brand span{
            display:block;
            font-size:.7rem;
            letter-spacing:3px;
            color:var(--accent);
        }

        .sidebar-nav{
            display:flex;
            flex-direction:column;
            gap:.5rem;
        }

        .nav-item{
            padding:12px 16px;
            border-radius:8px;
            color:rgba(255,255,255,.7);
            text-decoration:none;
            transition:.3s;
            font-weight:500;
        }

        .nav-item:hover,
        .nav-item.active{
            background:rgba(255,255,255,.08);
            color:white;
        }

        .dashboard-content{
            flex:1;
        }

        .premium-card{
            background:white;
            border-radius:14px;
            padding:3rem;
            box-shadow:0 20px 40px rgba(0,0,0,.05);
        }

        .page-title{
            font-family:'Playfair Display',serif;
            font-size:2rem;
            font-weight:700;
        }

        .custom-input{
            width:100%;
            padding:14px 18px;
            border:1px solid rgba(0,0,0,.1);
            border-radius:8px;
            outline:none;
            transition:.3s;
        }

        .custom-input:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(200,96,42,.1);
        }

        .btn-post{
            background:var(--ink);
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:8px;
            font-weight:600;
            transition:.3s;
        }

        .btn-post:hover{
            background:var(--accent);
        }

        .label-text{
            font-size:.8rem;
            text-transform:uppercase;
            font-weight:700;
            margin-bottom:8px;
            display:block;
            color:var(--ink-muted);
        }
    </style>
</head>

<body>

<div class="dashboard-wrapper">

    <aside class="dashboard-sidebar">

        <div class="sidebar-brand">
            NEXUS
            <span>ADMINISTRATOR</span>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}" class="nav-item">Dashboard</a>
            <a th:href="@{/admin/orders/manage}" class="nav-item">Orders</a>
            <a th:href="@{/admin/users}" class="nav-item">Users</a>
            <a th:href="@{/admin/announcements/list}" class="nav-item active">Announcements</a>
        </nav>

    </aside>

    <main class="dashboard-content">

        <div class="premium-card">

            <h1 class="page-title"
                th:text="${announcement.id != null} ?
                'Edit Announcement' : 'Post Announcement'">
            </h1>

            <p class="text-muted mb-4">
                Publish updates visible to all visitors.
            </p>

            <hr class="mb-4">

            <form th:action="${announcement.id != null} ?
            @{/admin/announcements/edit/{id}(id=${announcement.id})} :
            @{/admin/announcements}"
                  th:object="${announcement}"
                  method="post">

                <div class="mb-4">
                    <label class="label-text">Title</label>

                    <input type="text"
                           th:field="*{title}"
                           class="custom-input"
                           required>
                </div>

                <div class="mb-4">
                    <label class="label-text">Content</label>

                    <textarea th:field="*{content}"
                              rows="8"
                              class="custom-input"
                              required></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center">

                    <a th:href="@{/announcements}"
                       class="text-decoration-none text-muted">
                        Preview Public Page
                    </a>

                    <button type="submit" class="btn-post">

                        <span th:text="${announcement.id != null} ?
                        'Update Announcement' : 'Publish Announcement'"></span>

                    </button>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
