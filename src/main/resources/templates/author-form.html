<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${author.id != null} ? 'Edit Author — Nexus Admin' : 'Add Author — Nexus Admin'">Author Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: #f5f7fa; font-family: 'DM Sans', sans-serif; padding: 3rem; }
    .card-box { background: white; padding: 2.5rem; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.04); border-top: 4px solid #c8602a; max-width: 640px; margin: auto; }
    .page-title { font-family: 'Playfair Display', serif; font-weight: 700; color: #1a1a1a; }
    .form-label { font-weight: 600; color: #444; }
    .section-divider { border-top: 2px dashed #eee; padding-top: 1.5rem; margin-top: 1.5rem; }
    .featured-box { background: #fff8f5; border: 1.5px solid #f0d0c0; border-radius: 10px; padding: 1.2rem 1.5rem; }
    .featured-title { font-weight: 700; color: #c8602a; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card-box">

  <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
    <a href="/admin/authors/list" class="btn btn-light btn-sm rounded-pill px-3">
      <i class="bi bi-arrow-left me-1"></i> Back
    </a>
    <h2 class="page-title mb-0 fs-4">
      <span th:text="${author.id != null} ? 'Edit Author' : 'Register New Author'">Author Form</span>
    </h2>
  </div>

  <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show fw-bold border-0 shadow-sm">
    <i class="bi bi-check-circle-fill me-2"></i> Author saved successfully!
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <form th:action="@{/admin/authors/save}" th:object="${author}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">Author Full Name</label>
      <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. J.K. Rowling">
    </div>

    <div class="mb-3">
      <label class="form-label">Biography</label>
      <textarea th:field="*{biography}" class="form-control" rows="4" placeholder="Brief history of the author..."></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Profile Image URL</label>
      <input type="url" th:field="*{profileImageUrl}" class="form-control" placeholder="https://example.com/image.jpg">
      <div class="form-text">Paste a link to the author's photo (optional).</div>
    </div>

    <div class="section-divider">
      <div class="featured-box">
        <p class="featured-title mb-3"><i class="bi bi-star-fill me-2"></i>Home Page Feature Settings</p>

        <div class="mb-3">
          <label class="form-label">Award Title</label>
          <input type="text" name="awardTitle" id="awardTitle" class="form-control" placeholder="e.g. Booker Prize Winner">
          <div class="form-text">Leave blank if this author has no award to display.</div>
        </div>

        <div class="form-check form-switch mt-3">
          <input class="form-check-input" type="checkbox" role="switch"
                 name="featuredOnHomePage" id="featuredSwitch" value="true"
                 style="width: 3em; height: 1.5em;">
          <label class="form-check-label ms-2 fw-bold" for="featuredSwitch">
            Show this author on the Home Page
          </label>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 pt-4 mt-3 border-top">
      <button type="submit" class="btn btn-dark fw-bold px-4 rounded-pill" style="background:#c8602a; border:none;">
        <i class="bi bi-save me-1"></i>
        <span th:text="${author.id != null} ? 'Update Author' : 'Save Author'">Save</span>
      </button>
      <a href="/admin/authors/list" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
