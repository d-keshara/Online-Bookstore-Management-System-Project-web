# ==========================================
# ☁️ CLOUD-READY CONFIGURATION
# ==========================================

# 1. Database Configuration (Hidden behind variables!)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_bookstore_web?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:local_password_hidden}

# Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# 2. AI API Configuration
# Paste your actual key here for local testing, but NEVER commit this real key to GitHub!
gemini.api.key=${GEMINI_API_KEY:google_key_hidden}